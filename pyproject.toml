[project]
name = "skill-forge"
version = "0.1.0"
description = "A multi-agent system that generates Zero-to-Hero learning roadmaps for any skill, with curated courses, certifications, and media."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["crewai", "multi-agent", "llm", "claude", "anthropic", "learning-roadmap"]

dependencies = [
    # Pinned for reproducibility. crewai >= 1.11 makes `lancedb` a hard core
    # dependency, and lancedb ships no macOS x86_64 wheels after 0.9.0, so
    # newer versions cannot be installed on Intel Macs at all.
    "crewai<=1.9.3",
    "pydantic>=2.11.10",
    "python-dotenv>=1.1.1",
    "requests>=2.34.2",
    # chromadb (a crewai dependency) pulls onnxruntime; only <=1.23.2 has
    # macOS x86_64 wheels. Scoped so other platforms stay unconstrained.
    "onnxruntime<=1.23.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "google-genai>=2.8.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
skill-forge = "skill_forge.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_forge"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
